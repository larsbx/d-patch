# biz-kit's end-to-end stack (its scripts/e2e-stack.sh), started in the
# background for this job: dispatch on :4000, SpruceGoose's /auth on :4001.
# The job provides PostgreSQL with PostGIS on :5432 (user and password
# "postgres"), because a composite action cannot declare a service.
#
# biz-kit is checked out at the revision biz-kit-ref resolves.

name: biz-kit stack
description: Check out biz-kit and serve its end-to-end stack
inputs:
  public-auth-url:
    description: Where a browser reaches /auth (the emulator sees the host as 10.0.2.2)
    default: http://127.0.0.1:4001
outputs:
  dir:
    description: Where biz-kit is checked out
    value: ${{ github.workspace }}/biz-kit
runs:
  using: composite
  steps:
    - id: ref
      uses: ./.github/actions/biz-kit-ref
    - uses: actions/checkout@v4
      with: { repository: larsbx/biz-kit, ref: "${{ steps.ref.outputs.ref }}", path: biz-kit }
    - uses: erlef/setup-beam@v1
      with: { otp-version: "27.3.4", elixir-version: "1.19.0" }
    # The Rust NIF's output lives in the source tree, not _build: cache it
    # with the build, or a restored build skips the compile that wrote it and
    # the stack cannot load it. Keyed on the NIF's sources as well.
    - uses: actions/cache@v4
      with:
        path: |
          biz-kit/deps
          biz-kit/_build
          biz-kit/apps/coop_substrate/priv/native
        key: biz-kit-dev-v2-${{ runner.os }}-${{ hashFiles('biz-kit/mix.lock', 'biz-kit/apps/coop_substrate/native/**') }}
    - name: serve
      shell: bash
      working-directory: biz-kit
      env:
        PGPASSWORD: postgres
        SPRUCE_GOOSE_PUBLIC_URL: ${{ inputs.public-auth-url }}
      run: |
        nohup scripts/e2e-stack.sh > "$RUNNER_TEMP/biz-kit-stack.log" 2>&1 &
        for _ in $(seq 1 120); do
          if curl -sf -o /dev/null http://127.0.0.1:4000/health/live && curl -s -o /dev/null http://127.0.0.1:4001/auth/me; then
            echo "biz-kit stack is up (ref ${{ steps.ref.outputs.ref }})"; exit 0
          fi
          sleep 5
        done
        tail -100 "$RUNNER_TEMP/biz-kit-stack.log"; exit 1
