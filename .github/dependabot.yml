# Dependency updates as reviewable pull requests: weekly, one grouped pull
# request per ecosystem and directory, and security updates as they land.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /apps/android-driver
    schedule: { interval: weekly }
    groups: { gradle: { patterns: ['*'] } }
  - package-ecosystem: mix
    directory: /central
    schedule: { interval: weekly }
    groups: { mix: { patterns: ['*'] } }
  - package-ecosystem: npm
    directories: [/e2e, /web]
    schedule: { interval: weekly }
    groups: { npm: { patterns: ['*'] } }
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/biz-kit-stack, /.github/actions/biz-kit-ref]
    schedule: { interval: weekly }
    groups: { actions: { patterns: ['*'] } }
