org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
org.gradle.caching=true

# The configuration cache is off: Kotlin 2.1.0's KotlinCompile task cannot
# serialise its classpath snapshot under AGP 8.7.3, so enabling it fails the
# build with a serialisation error rather than speeding it up. Re-enable it when
# the toolchain versions in gradle/libs.versions.toml move past that pairing,
# and verify with `./gradlew testDebugUnitTest --configuration-cache`.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
